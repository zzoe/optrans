[package]
name = "optrans"
version = "0.23.0"
edition = "2024"
description = "无网络文件传输：通过屏幕视觉编码在隔离网络间单向传递文件"

[[bin]]
name = "optrans"
path = "src/main.rs"

[dependencies]
clap = { version = "*", features = ["derive"] }
sha2 = "*"
reed-solomon = "*"
log = "*"
pretty_env_logger = "*"

[profile.release]
opt-level = 3
lto = true
